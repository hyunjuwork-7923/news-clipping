<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<title>서울 클리핑 · {{TARGET_DATE}}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --surface: #faf7f2;
    --rule: #ddd4c6;
    --rule-strong: #c7bca8;
    --text: #221f1c;
    --text-muted: #746c60;
    --accent: #b5482e;
    --dept-bg: #efe9dd;
    --dept-text: #5a5245;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17;
      --surface: #1c1a17;
      --rule: #3a352c;
      --rule-strong: #4a4436;
      --text: #f2ede4;
      --text-muted: #a89e8e;
      --accent: #e0805f;
      --dept-bg: #2c2820;
      --dept-text: #c9bfae;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17;
    --surface: #1c1a17;
    --rule: #3a352c;
    --rule-strong: #4a4436;
    --text: #f2ede4;
    --text-muted: #a89e8e;
    --accent: #e0805f;
    --dept-bg: #2c2820;
    --dept-text: #c9bfae;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 56px 24px 80px;
  }

  .page { max-width: 680px; margin: 0 auto; }

  header { margin-bottom: 44px; }
  header .eyebrow {
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 10px;
  }
  header h1 {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 8px;
    letter-spacing: -.01em;
  }
  header .sub { color: var(--text-muted); font-size: 14px; }

  section.block { margin-bottom: 44px; }
  section.block h2 {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 4px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--rule-strong);
  }
  section.block .section-note {
    font-size: 12px;
    color: var(--text-muted);
    margin: 10px 0 0;
  }

  .item {
    display: block;
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
  }
  .item:last-child { border-bottom: none; }

  .item .num {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    margin-right: 6px;
  }
  .item .headline {
    font-family: "Noto Serif KR", serif;
    font-weight: 500;
    font-size: 16.5px;
    line-height: 1.5;
    color: inherit;
    text-decoration: none;
  }
  .item a.headline:hover { color: var(--accent); }

  .item .dept {
    display: inline-block;
    font-size: 11px;
    color: var(--dept-text);
    background: var(--dept-bg);
    border-radius: 4px;
    padding: 1px 7px;
    margin-left: 8px;
    vertical-align: 1px;
  }

  .item .detail {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.6;
    margin: 6px 0 0 20px;
  }

  ul.plain-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  ul.plain-list li {
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
  }
  ul.plain-list li:last-child { border-bottom: none; }
  ul.plain-list li::before {
    content: "—";
    color: var(--text-muted);
    margin-right: 8px;
  }

  @media (max-width: 480px) {
    body { padding: 40px 18px 64px; }
    header h1 { font-size: 23px; }
    .item .headline { font-size: 15.5px; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="eyebrow">Seoul City · Daily Clipping</div>
    <h1>서울 클리핑</h1>
    <div class="sub">{{TARGET_DATE}}</div>
  </header>

  <!-- Section 1: 언론보도 (市·SDF 관련) — general city/SDF press, NOT limited to goods.
       Each item is an <a class="item"> so the whole row links to 원문. 관련부서 is a small
       badge; omit it entirely (don't guess) if you can't confidently infer the department.
       .detail is optional — only include when the headline alone doesn't convey a key fact. -->
  <section class="block">
    <h2>1. 언론보도 (市·SDF 관련)</h2>

    <a class="item" href="{{URL}}" target="_blank" rel="noopener">
      <span class="num">1.1</span><span class="headline">{{기사 제목}}</span><span class="dept">{{관련부서}}</span>
      <div class="detail">{{주요내용 — 선택사항, 헤드라인에 없는 핵심 사실 한 줄}} ({{매체명}})</div>
    </a>

    <!-- ...repeat 1.2, 1.3... up to a reasonable count (5 is a sensible ceiling).
         If zero qualify, replace the items with a single sentence inside this section
         saying so — keep the "1. 언론보도" header visible either way. -->

  </section>

  <!-- Section 2: SNS채널 — official social posts. This session generally CANNOT verify
       actual post content without direct account access (logged-out platform pages don't
       expose the feed). Say that plainly rather than inventing post descriptions — see the
       section-note pattern below. Only state something as a confirmed post if you actually
       found it (e.g. a news article embedding or describing the post itself). -->
  <section class="block">
    <h2>2. SNS채널 (주요 게시건)</h2>
    <div class="section-note">
      {{이 세션에서 실제로 확인 가능했던 것과 확인 불가능했던 것을 여기에 명시}}
    </div>
    <ul class="plain-list">
      <li>{{확인된 사실만 — 추정 내용을 사실처럼 적지 말 것}}</li>
    </ul>
  </section>

  <!-- Section 3: 굿즈관련 — general Korean goods/merch trend news, NOT restricted to Seoul's
       own brand. A genuine launch/collab/completion-sellout story anywhere in Korea counts. -->
  <section class="block">
    <h2>3. 굿즈관련</h2>

    <a class="item" href="{{URL}}" target="_blank" rel="noopener">
      <span class="headline">{{기사 제목}}</span>
      <div class="detail">{{한국어 요약 1~2문장}} ({{매체명}})</div>
    </a>

    <!-- ...repeat up to a reasonable count (5 is a sensible ceiling). -->

  </section>

</div>
</body>
</html>
